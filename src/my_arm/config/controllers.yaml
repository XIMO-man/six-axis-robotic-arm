controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_fingers_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      joint_1: {trajectory: 0.2, goal: 0.03}
      joint_2: {trajectory: 0.2, goal: 0.03}
      joint_3: {trajectory: 0.2, goal: 0.03}
      joint_4: {trajectory: 0.2, goal: 0.03}
      joint_5: {trajectory: 0.2, goal: 0.03}
      joint_6: {trajectory: 0.2, goal: 0.03}

gripper_fingers_controller:
  ros__parameters:
    joints: [finger_joint, right_finger_joint]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    gains:
      finger_joint: {p: 1000.0, i: 0.0, d: 10.0, i_clamp: 0.0}
      right_finger_joint: {p: 1000.0, i: 0.0, d: 10.0, i_clamp: 0.0}
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.01
      finger_joint: {trajectory: 0.015, goal: 0.003}
      right_finger_joint: {trajectory: 0.015, goal: 0.003}
